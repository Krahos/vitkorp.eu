{% extends "base.html" %}

{% block main %}
  <main class="container prose">
    <h1>{{ taxonomy.name | capitalize }}</h1>
    <p class="tags">
      {% set tags = get_taxonomy(kind="tags") %}
      {% for post in tags.items %}
        <a href="{{ post.permalink }}">#{{ post.name }}</a>
      {% endfor %}
    </p>
  </main>
{% endblock %}
